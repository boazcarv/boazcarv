<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Boaz Carvalho — Desenvolvedor Backend Python</title>
  <desc id="desc">Capa escura com linhas e nós de uma rede tecnológica, apresentando Boaz Carvalho, FastAPI, Docker, Machine Learning e LLMs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#20153b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48d6ff"/>
      <stop offset="0.55" stop-color="#818cff"/>
      <stop offset="1" stop-color="#b783ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="50%" r="55%">
      <stop offset="0" stop-color="#6556d9" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6556d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9aa8ff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#background)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".34" stroke-width="1.5">
    <path d="M700 65 810 112 930 62 1050 116 1160 72"/>
    <path d="M690 161 810 112 900 182 1050 116 1150 204"/>
    <path d="M705 260 820 220 900 182 1030 265 1150 204"/>
    <path d="M810 112 820 220M930 62 900 182M1050 116 1030 265"/>
  </g>
  <g fill="#111a35" stroke="url(#accent)" stroke-width="2">
    <circle cx="700" cy="65" r="5"/><circle cx="810" cy="112" r="7"/><circle cx="930" cy="62" r="5"/>
    <circle cx="1050" cy="116" r="8"/><circle cx="1160" cy="72" r="5"/><circle cx="690" cy="161" r="5"/>
    <circle cx="900" cy="182" r="10"/><circle cx="1150" cy="204" r="7"/><circle cx="705" cy="260" r="5"/>
    <circle cx="820" cy="220" r="7"/><circle cx="1030" cy="265" r="6"/>
  </g>
  <circle cx="900" cy="182" r="27" fill="#818cff" fill-opacity=".12" filter="url(#softGlow)"/>
  <path d="M64 76h42" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="64" y="147" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="53" font-weight="700" letter-spacing="-1.5">Boaz Carvalho</text>
  <text x="66" y="190" fill="#b9c7e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500">Desenvolvedor Backend Python</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="64" y="225" width="94" height="34" rx="17" fill="#142744" stroke="#48d6ff" stroke-opacity=".7"/>
    <text x="111" y="247" fill="#a8eaff">FastAPI</text>
    <rect x="169" y="225" width="84" height="34" rx="17" fill="#1b2347" stroke="#818cff" stroke-opacity=".7"/>
    <text x="211" y="247" fill="#c4c8ff">Docker</text>
    <rect x="264" y="225" width="195" height="34" rx="17" fill="#292044" stroke="#b783ff" stroke-opacity=".7"/>
    <text x="361.5" y="247" fill="#e0c7ff">Machine Learning · LLMs</text>
  </g>
  <text x="66" y="296" fill="#8392b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Parnamirim/RN · IFRN</text>
  <rect x="64" y="318" width="1072" height="2" rx="1" fill="url(#accent)" opacity=".75"/>
</svg>
